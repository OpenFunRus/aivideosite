<header class="v2-mobile-bar">
    <button class="v2-mobile-menu-button" id="v2-mobile-menu-button" type="button" aria-label="Открыть меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="v2-mobile-brand" href="/v2">
      <span class="v2-mobile-brand-mark">
        <svg class="icon"><use href="/static/icons.svg#icon-player-play"></use></svg>
      </span>
      <strong>AI Video Site <em>V2</em></strong>
    </a>
    <button class="v2-mobile-character-button v2-mobile-preset-button" id="v2-mobile-character-button" type="button" aria-label="Открыть пресеты" aria-expanded="false">
      <svg class="icon"><use href="/static/icons.svg#icon-stack"></use></svg>
      <span class="v2-mobile-preset-count v2-mobile-character-count" id="v2-mobile-character-count" title="Выбрано персонажей" hidden>0</span>
      <span class="v2-mobile-preset-count v2-mobile-location-count" id="v2-mobile-location-count" title="Выбрано локаций" hidden>0</span>
    </button>
  </header>
  <button class="v2-mobile-backdrop" id="v2-mobile-backdrop" type="button" aria-label="Закрыть меню"></button>
